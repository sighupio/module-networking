---
image:
  repository: "registry.sighup.io/fury/cilium/cilium"
  useDigest: false
# Workaround for https://github.com/cilium/cilium/issues/44464:
# removes the build-config init container, which breaks kube-apiserver
# connectivity on upgrade when kube-proxy is in IPVS mode.
# Valid only because we configure Cilium via the cilium-config ConfigMap only.
daemon:
  configSources: "config-map:cilium-config"
hubble:
  metrics:
    enabled:
      - dns
      - drop
      - tcp
      - flow
      - port-distribution
      - icmp
      - httpV2:exemplars=true;labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload,traffic_direction
    enableOpenMetrics: true
    tls:
      enabled: true
    serviceMonitor:
      enabled: true
      tlsConfig:
        ca:
          secret:
            name: hubble-ca-secret
            key: ca.crt
    dashboards:
      enabled: true
      label: grafana-sighup-dashboard
      annotations:
        grafana-folder: "Networking"
      labelValue: "true"
  tls:
    auto:
      method: certmanager
      certValidityDuration: 1095
      certManagerIssuerRef:
        group: cert-manager.io
        kind: Issuer
        name: hubble-issuer
  relay:
    enabled: true
    image:
      repository: "registry.sighup.io/fury/cilium/hubble-relay"
      useDigest: false
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
  ui:
    enabled: true
    backend:
      image:
        repository: "registry.sighup.io/fury/cilium/hubble-ui-backend"
        useDigest: false
    frontend:
      image:
        repository: "registry.sighup.io/fury/cilium/hubble-ui"
        useDigest: false
prometheus:
  metricsService: true
  enabled: true
  serviceMonitor:
    enabled: true
operator:
  image:
    # IMPORTANT: Do NOT include "-generic" in repository name!
    # Helm template automatically appends cloud suffix (defaults to "generic")
    # See templates/cilium-operator/_helpers.tpl line 35 for logic:
    # printf "%s-%s%s%s%s" .Values.operator.image.repository $cloud .Values.operator.image.suffix $tag $imageDigest
    # Result: registry.sighup.io/fury/cilium/operator-generic:v1.18.7
    repository: "registry.sighup.io/fury/cilium/operator"
    useDigest: false
  dashboards:
    enabled: true
    label: grafana-sighup-dashboard
    labelValue: "true"
    annotations:
      grafana-folder: "Networking"
  prometheus:
    metricsService: true
    serviceMonitor:
      enabled: true
envoy:
  enabled: false
dashboards:
  enabled: true
  label: grafana-sighup-dashboard
  labelValue: "true"
  annotations:
    grafana-folder: "Networking"
